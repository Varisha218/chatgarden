<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGarden Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100vw;height:100vh}#status{position:fixed;left:24px;bottom:24px;padding:12px 16px;border-radius:12px;background:rgba(24,44,33,.92);color:#fff8df;font:600 16px system-ui,sans-serif;z-index:2}
  </style>
</head>
<body><canvas id="garden" width="1920" height="1080" aria-label="ChatGarden stream overlay"></canvas><div id="status">Loading ChatGarden…</div><script>
  window.addEventListener('error', event => { if (event.filename) document.querySelector('#status').textContent = `Script error: ${event.message} (${event.filename})`; });
  const gardenScript = document.createElement('script');
  gardenScript.src = '/assets/overlay-v10.js';
  gardenScript.onload = () => { const status = document.querySelector('#status'); if (status.textContent === 'Loading ChatGarden…') status.textContent = 'Overlay code loaded; connecting…'; };
  gardenScript.onerror = () => { document.querySelector('#status').textContent = 'Could not load /assets/overlay-v10.js'; };
  document.body.appendChild(gardenScript);
</script></body>
</html>
